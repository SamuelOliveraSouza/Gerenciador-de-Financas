<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css')}}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cadastre-se</h1>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="email" id="email" placeholder="Digite seu email">
    <input type="password" id="senha" placeholder="Crie sua senha">
    <button id="btn-cadastro">Cadastre-se</button>
    <a href="/login">Já tem conta? Faça login!</a>

    <script>
        function cadastro() {
            let nome = document.getElementById("nome").value
            let email = document.getElementById("email").value
            let senha = document.getElementById("senha").value
            fetch("/cadastro", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({nome, email, senha})
            })
            .then(res => res.json())
            .then(dados => {
                if (dados.mensagem) {
                    window.location.href = "/login"
                } else {
                    alert(dados.ERRO)
                }
            })
        }
        document.getElementById("btn-cadastro").onclick = cadastro
    </script>
</body>
</html>
